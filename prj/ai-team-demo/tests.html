<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Team Demo — Tests</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 32px; background: #f4f7fb; }
      h1 { margin-bottom: 16px; }
      .suite { margin-bottom: 24px; }
      .suite h2 { font-size: 1rem; margin-bottom: 8px; color: #374151; }
      .result { padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 0.9rem; }
      .pass { background: #dcfce7; color: #166534; }
      .fail { background: #fee2e2; color: #991b1b; }
      #summary { font-weight: 700; margin-top: 16px; font-size: 1.1rem; }
    </style>
  </head>
  <body>
    <h1>Test runner</h1>
    <div id="output"></div>
    <p id="summary"></p>
    <script type="module" src="./test-runner.js"></script>
  </body>
</html>
